; Screens where a player changes the campaign. Opening one needs the co-op baton (CoopEditGate).
; Class names; subclasses count too (UISimpleCommodityScreen = research, proving ground, black market buy...).
[WOTCCoopCampaign.CoopEditGate]
+EditScreens=UISimpleCommodityScreen
+EditScreens=UIInventory
+EditScreens=UIArmory
+EditScreens=UIBuildFacilities
+EditScreens=UIChooseFacility
+EditScreens=UIFacilityUpgrade
+EditScreens=UIChooseUpgrade
+EditScreens=UIRecruitSoldiers
+EditScreens=UISquadSelect
+EditScreens=UIBlackMarket_Sell
+EditScreens=UICovertActions
+EditScreens=UIStrategyMap
+EditScreens=UIStrategyPolicy
+EditScreens=UIPersonnel
; screens to look at, not change: they open without the baton (exact classes; their edit sub-screens stay gated)
+ViewScreens=UIPersonnel
+ViewScreens=UIPersonnel_Armory
+ViewScreens=UIPersonnel_BarMemorial
+ViewScreens=UIArmory_MainMenu

; Player slot this machine plays: -1 = from the connection (client = guest 1, otherwise host 0).
; Single-instance tests set 0 or 1.
[WOTCCoopCampaign.CoopRole]
LocalSlotOverride=-1
; host: seconds the guests have to answer a roll call after a connection closes
RollCallSeconds=2

; Co-op mission turns. Split: at mission start the XCom initiative group is split by soldier owner (host's
; group, then each guest's in slot order), only when guests were connected at launch.
; Handoff: each machine runs its own group's turn and the others watch (CoopTacticalRuleset, XComEngine.ini).
[WOTCCoopCampaign.CoopTactical]
bSplitXComGroupAtStart=true
bHandoff=true

; In missions a player can select only their own (or unowned) soldiers; the host also those of absent guests.
[WOTCCoopCampaign.CoopTacticalController]
bGateSelection=true

; Join flow: check that both players run the same mods before the host sends the campaign history.
[WOTCCoopCampaign.CoopJoin]
bGateJoinOnMods=false

; The host makes campaign decisions; guests may open the Armory's soldier list and soldier screens for their own
; soldiers only (other edit screens close). Off: guests change the campaign too, through the baton.
[WOTCCoopCampaign.CoopGuestRights]
bHostDecidesCampaign=true

; Draft: join by Steam invite (the host's session is marked as co-op; other invites keep the game's own handling).
[WOTCCoopCampaign.CoopSteamJoin]
bSteamInvites=false
SteamPort=7779

; Connection. The host closes it while a mission is built: with a connection open the game counts as
; multiplayer and builds the mission without aliens or objectives. Guests reconnect by themselves.
[WOTCCoopCampaign.CoopLink]
DefaultPort=7778
ReconnectSeconds=600
ReconnectInterval=3
; a first join keeps trying this long if the host is not reachable yet (its server not open)
JoinRetrySeconds=300
; a guest that has its player slot but gets no history (campaign or mission) this long reconnects; longer than
; WaitForGuestsSeconds, which a guest may legitimately wait for the other guests
JoinNoHistorySeconds=150
; test hook only (the runner sets it): the host skips the campaign send for this many joins
TestHoldJoinSends=0
; experiment: compact the history before each campaign send (see CoopTacticalNet.ArchiveBeforeSend)
bArchiveBeforeCampaignSend=false
; experiment: after the first whole history, send the next ones as a delta (CoopTacticalNet.SendWhole)
bPartialResend=false
WaitForGuestsSeconds=120
ReturnReopenDelay=5
JoinCoalesceSeconds=3
bCloseForMissionBuild=true
; guest: seconds the world stays paused before leaving the Avenger or a mission for the main menu (an Avenger
; matinee sound posted just before the map unload crashed the guest; see CoopLink.StartQuietLeave)
QuietLeaveSeconds=1.0
; host: loading a save of a co-op campaign (on the Avenger or inside a mission) opens the server again
bAutoHostOnLoad=true

[WOTCCoopCampaign.CoopHUDScreen]
; test copies show the game's own debug "red screens" (base-game content errors); true hides them for people playing
bHideDebugRedScreens=false

[WOTCCoopCampaign.CoopMissionLoading]
; test hook only (the runner sets it): the guest's mission loading screen takes a screenshot on each step
bLoadingTestShots=false

[WOTCCoopCampaign.CoopChunks]
; experiment: a history sent in chunks of this many bytes, at most ChunkWindow chunks ahead of the slowest guest
; one chunk must fit in one network bunch: 16384 overflowed it and closed the connection (chunktest 2026-11-24)
ChunkBytes=400
ChunkWindow=32

[WOTCCoopCampaign.CoopBalanced]
; balanced co-op campaign, per player beyond the first (placeholders until tuned): units added to every alien pod,
; alert levels added (a mission schedule with more pods); the one stronger enemy is rolled this many force levels higher
PodsPerPlayer=1
AlertPerPlayer=1
; the one stronger enemy: +4 force levels (owner, 2026-11-24; +2 only reached early units)
LaterEnemyForceLevel=4

[WOTCCoopCampaign.CoopShellScene]
; main menu: the player's own soldiers (character pool; random ones when it is empty) in the menu scene
bMenuSoldiers=true
MenuSoldierCount=4
MenuSoldierDistance=420
MenuSoldierSpacing=110
MenuSoldierDelay=3

[WOTCCoopCampaign.CoopScenario]
; scenario mode, first version: by stage (early, mid, late)
+StageForceLevel=3
+StageForceLevel=9
+StageForceLevel=16
+StageAlertLevel=2
+StageAlertLevel=3
+StageAlertLevel=4
; ranks above rookie (1 squaddie ... 7 colonel)
+StageRanks=2
+StageRanks=4
+StageRanks=6
+StagePrimary=ChallengePrimaryConventionalWeapons
+StagePrimary=ChallengePrimaryMagneticWeapons
+StagePrimary=ChallengePrimaryBeamWeapons
+StageSecondary=ChallengeSecondaryConventionalWeapons
+StageSecondary=ChallengeSecondaryMagneticWeapons
+StageSecondary=ChallengeSecondaryBeamWeapons
+StageArmor=ChallengeStandardConventionalArmor
+StageArmor=ChallengeStandardPlatedArmor
+StageArmor=ChallengeStandardPoweredArmor
ClassSelector=ChallengeSoldiers_RandomVanilla
UtilitySelector=ChallengeStandardUtilityItems
EnemySelector=ChallengeStandardSchedule
; host: the first turn waits at most this long for the players to join and load the mission
WaitForPlayersSeconds=180
