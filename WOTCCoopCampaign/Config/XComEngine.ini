[Engine.ScriptPackages]
+NonNativePackages=WOTCCoopCampaign

[UnrealEd.EditorEngine]
+ModEditPackages=WOTCCoopCampaign

[Engine.Engine]
+ModClassOverrides=(BaseGameClass="XComHeadquartersGame", ModClass="WOTCCoopCampaign.CoopHeadquartersGame")
+ModClassOverrides=(BaseGameClass="XComAutosaveMgr", ModClass="WOTCCoopCampaign.CoopAutosaveMgr")
+ModClassOverrides=(BaseGameClass="XComTacticalController", ModClass="WOTCCoopCampaign.CoopTacticalController")
; a guest on the Avenger leaves for the main menu in a controlled way when the host closes the connection
+ModClassOverrides=(BaseGameClass="XComHeadquartersController", ModClass="WOTCCoopCampaign.CoopHeadquartersController")
; the same on the main menu, for a guest waiting in a lobby or reconnecting
+ModClassOverrides=(BaseGameClass="XComShellController", ModClass="WOTCCoopCampaign.CoopShellController")
; Co-op mission turns (CoopTacticalRuleset). Without a co-op connection it behaves like the game's ruleset.
; Conflicts with any other mod that replaces X2TacticalGameRuleset.
+ModClassOverrides=(BaseGameClass="X2TacticalGameRuleset", ModClass="WOTCCoopCampaign.CoopTacticalRuleset")
; Single-player rule values while a co-op campaign has its connection open (CoopRules).
+ModClassOverrides=(BaseGameClass="X2AbilityToHitCalc_StandardAim", ModClass="WOTCCoopCampaign.CoopToHitCalc_StandardAim")
+ModClassOverrides=(BaseGameClass="X2Effect_Suppression", ModClass="WOTCCoopCampaign.CoopEffect_Suppression")
+ModClassOverrides=(BaseGameClass="X2Effect_SpawnShadowbindUnit", ModClass="WOTCCoopCampaign.CoopEffect_SpawnShadowbindUnit")
; unit flags show each soldier's owner (a colored tag) in co-op campaigns
+ModClassOverrides=(BaseGameClass="UIUnitFlag", ModClass="WOTCCoopCampaign.CoopUnitFlag")
